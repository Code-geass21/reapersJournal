version: '3.8'

services:
  db:
    image: postgres:16
    container_name: rj_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rj_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in your environment}
      TZ: ${TZ}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      PRICE_REFRESH_SECS: ${PRICE_REFRESH_SECS}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rj_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in your environment}
      PRICE_REFRESH_SECS: ${PRICE_REFRESH_SECS}
      TZ: ${TZ}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
    volumes:
      - backups:/app/backups
      - uploads:/app/uploads

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: rj_nginx
    restart: always
    ports:
      - "${PUBLIC_PORT:-54311}:80"
    depends_on:
      - backend

  # ---- Test stack: NOT started by a normal deploy. Run with:
  #      docker compose --profile test run --rm tests
  db_test:
    image: postgres:16
    container_name: rj_db_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: reapers_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d reapers_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    profiles: ["test"]
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://test:test@db_test:5432/reapers_test
      JWT_SECRET: test-secret
      TZ: ${TZ:-UTC}
    command: sh -c "pip install --no-cache-dir -r requirements-dev.txt && python -m pytest app/tests -q"

volumes:
  pgdata:
  uploads:
  backups:
