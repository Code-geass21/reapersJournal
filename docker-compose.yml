version: '3.8'

services:
  db:
    image: postgres:16
    container_name: rj_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rj_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: rj_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PRICE_REFRESH_SECS: ${PRICE_REFRESH_SECS}
      TZ: ${TZ}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
    volumes:
      - backups:/app/backups
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: rj_frontend
    restart: always
    environment:
      TZ: ${TZ}
    expose:
      - "5173"

  nginx:
    build:
      context: ./nginx
    container_name: rj_nginx
    restart: always
    ports:
      - "${PUBLIC_PORT:-54311}:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  uploads:
  backups:
