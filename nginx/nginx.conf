events {}
http {
    server {
        listen 80;

        # When a request comes to /api...
        location /api/ {
            # Pass it to the backend WITHOUT stripping the /api prefix
            # Notice the lack of a trailing slash after :8000
            proxy_pass http://backend:8000;
        }

        location / {
            proxy_pass http://frontend:5173/;
        }
    }
}
