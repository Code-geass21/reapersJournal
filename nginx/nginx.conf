events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # FIX FOR BUG 99: Gzip Compression to shrink the React bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    server {
        listen 80;
        client_max_body_size 50M;

        # Proxy API requests to the FastAPI backend
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # FIX FOR BUG 99: Prevent large backup/restore from timing out (default is 60s)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }

        # Serve React static files for everything else
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # Fallback to index.html for React Router
            try_files $uri $uri/ /index.html;

            # Cache static assets to improve load speeds
            location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
                expires 6M;
                access_log off;
                add_header Cache-Control "public";
            }
        }
    }
}
